[package]
name = "rust-repo-sentinel"
version = "0.1.0"
edition = "2024"
description = "A local-first Rust repository analyzer for detecting risky configuration and dependency patterns."
license = "MIT"
readme = "README.md"

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
